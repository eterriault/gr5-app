<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Vider le cache GR5</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
    pre  { white-space: pre-wrap; }
  </style>
</head>
<body>
<pre id="log">Nettoyage en cours...\n</pre>
<script>
(async () => {
  const log = document.getElementById('log');
  const say = s => { log.textContent += s + '\n'; };

  // Désenregistre tous les SW
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) {
      await r.unregister();
      say('SW désenregistré : ' + r.scope);
    }
  }

  // Vide tous les caches
  const keys = await caches.keys();
  for (const k of keys) {
    await caches.delete(k);
    say('Cache supprimé : ' + k);
  }

  say('\nFait. Retourne sur http://localhost:8080 et recharge.');
})();
</script>
</body>
</html>
